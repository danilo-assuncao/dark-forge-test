<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Mobility - Aluguel de Carros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Dan Mobility</h1>
        <p>Aluguel de Carros</p>
    </header>
    
    <main>
        <form id="rental-form">
            <section>
                <h2>Detalhes da Reserva</h2>
                <label for="vehicle-group">Grupo de Veículo:</label>
                <select id="vehicle-group" required>
                    <option value="" disabled selected>Selecione um grupo</option>
                    <option value="A">Grupo A - Econômico (R$ 80/dia)</option>
                    <option value="B">Grupo B - Compacto (R$ 100/dia)</option>
                    <option value="C">Grupo C - Sedan (R$ 150/dia)</option>
                    <option value="D">Grupo D - SUV (R$ 200/dia)</option>
                </select>

                <label for="days">Quantidade de Dias:</label>
                <input type="number" id="days" name="days" min="1" required>

                <label for="km-modality">Modalidade de KM:</label>
                <select id="km-modality" required>
                    <option value="limited">KM Controlado (100km/dia)</option>
                    <option value="unlimited">KM Livre (+R$ 30/dia)</option>
                </select>
            </section>

            <section>
                <h2>Proteções e Acessórios</h2>
                <label>
                    <input type="checkbox" id="protection-basic" value="20"> Proteção Básica (+R$ 20/dia)
                </label>
                <label>
                    <input type="checkbox" id="protection-premium" value="50"> Proteção Premium (+R$ 50/dia)
                </label>
                <label>
                    <input type="checkbox" id="accessory-gps" value="10"> GPS (+R$ 10/dia)
                </label>
                <label>
                    <input type="checkbox" id="accessory-babyseat" value="15"> Cadeira de Bebê (+R$ 15/dia)
                </label>
            </section>

            <section>
                <h2>Dados do Condutor</h2>
                <label for="age">Idade:</label>
                <input type="number" id="age" name="age" min="18" required>

                <label for="cnh">CNH (11 dígitos):</label>
                <input type="text" id="cnh" name="cnh" required pattern="\d{11}" placeholder="Ex: 12345678901">

                <label for="coupon">Cupom de Desconto:</label>
                <input type="text" id="coupon" name="coupon" placeholder="Ex: DANCAR10">
            </section>

            <button type="submit" id="submit-btn">Reservar e Gerar Voucher</button>
        </form>

        <section id="voucher-section" class="hidden">
            <h2>Resultado</h2>
            <pre id="voucher-details"></pre>
            <p id="error-message" class="error hidden"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
