<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none';">
  <title>Dan Gourmet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Dan Gourmet</h1>
  </header>
  
  <main>
    <section id="filters">
      <h2>Filtros</h2>
      <div>
        <label for="category-filter">Categoria:</label>
        <select id="category-filter">
          <option value="">Todas</option>
          <option value="entradas">Entradas</option>
          <option value="principais">Principais</option>
          <option value="sobremesas">Sobremesas</option>
          <option value="bebidas">Bebidas</option>
        </select>
      </div>
      <div>
        <label for="dietary-filter">Dieta:</label>
        <select id="dietary-filter">
          <option value="">Qualquer</option>
          <option value="vegano">Vegano</option>
          <option value="vegetariano">Vegetariano</option>
          <option value="sem-gluten">Sem Glúten</option>
        </select>
      </div>
      <div id="allergen-filters">
        <span>Remover Alérgenos:</span>
        <label><input type="checkbox" value="lactose"> Lactose</label>
        <label><input type="checkbox" value="gluten"> Glúten</label>
        <label><input type="checkbox" value="castanhas"> Castanhas</label>
        <label><input type="checkbox" value="frutos-do-mar"> Frutos do Mar</label>
      </div>
      <button id="apply-filters">Filtrar</button>
    </section>

    <section id="menu-vitrine">
      <h2>Vitrine</h2>
      <div id="vitrine-items"></div>
    </section>

    <section id="cart">
      <h2>Sacola e Simulação</h2>
      <ul id="cart-items"></ul>
      
      <div id="checkout-options">
        <div>
          <label for="distance-input">Distância (km):</label>
          <input type="number" id="distance-input" min="0" max="15" value="5">
        </div>
        <div>
          <label for="tip-input">Gorjeta (%):</label>
          <select id="tip-input">
            <option value="0">0%</option>
            <option value="10">10%</option>
            <option value="12">12%</option>
          </select>
        </div>
        <div>
          <label for="coupon-input">Cupom:</label>
          <input type="text" id="coupon-input" placeholder="Ex: DANCHEF10">
        </div>
        <div>
          <label for="name-input">Nome:</label>
          <input type="text" id="name-input" value="Cliente">
        </div>
        <div>
          <label for="address-input">Endereço:</label>
          <input type="text" id="address-input" value="Rua A, 123">
        </div>
        <button id="checkout-btn">Finalizar Pedido</button>
      </div>
    </section>

    <section id="receipt" style="display:none;">
      <h2>Recibo</h2>
      <div id="receipt-content"></div>
    </section>
  </main>

  <script src="loader.js"></script>
</body>
</html>
