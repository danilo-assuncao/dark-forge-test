<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="only light">
    <title>Dan Tech Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <h1>Dan Tech Store</h1>
        <nav aria-label="Seções">
            <a href="#vitrine">Vitrine</a>
            <a href="#montador">Montador de PC</a>
            <a href="#carrinho">Carrinho</a>
        </nav>
    </header>
    <main>
        <section id="vitrine" aria-labelledby="t-vitrine">
            <h2 id="t-vitrine">Vitrine</h2>
            <div class="filters">
                <label>Categoria <select id="filter-category"></select></label>
                <label>Buscar <input id="filter-query" type="search" placeholder="Nome do produto"></label>
                <label>Preço máximo (R$) <input id="filter-price" type="number" min="0" step="50"></label>
            </div>
            <p id="showcase-count" aria-live="polite"></p>
            <div id="showcase" class="grid"></div>
        </section>

        <section id="montador" aria-labelledby="t-montador">
            <h2 id="t-montador">Montador de PC</h2>
            <div class="builder">
                <label>Processador <select id="slot-cpu"></select></label>
                <label>Placa-mãe <select id="slot-motherboard"></select></label>
                <label>Memória <select id="slot-ram"></select></label>
                <label>Placa de vídeo <select id="slot-gpu"></select></label>
                <label>Fonte <select id="slot-psu"></select></label>
            </div>
            <div class="filters" style="margin-top: 1rem;">
                <label>Garantia
                    <select id="build-warranty">
                        <option value="12">12 meses</option>
                        <option value="24">24 meses</option>
                    </select>
                </label>
            </div>
            <ul id="alerts" class="alerts" aria-live="polite"></ul>
            <p id="build-total"></p>
            <div style="display: flex; gap: 1rem;">
                <button id="build-add" class="btn" type="button" disabled>Adicionar montagem ao carrinho</button>
                <button id="build-specsheet" class="btn" type="button" disabled>Gerar Resumo Técnico</button>
            </div>
            <div id="specsheet-output" class="specsheet-box" aria-live="polite" style="display: none;"></div>
        </section>

        <section id="carrinho" aria-labelledby="t-carrinho">
            <h2 id="t-carrinho">Carrinho e fechamento</h2>
            <ul id="cart-items" class="cart-items"></ul>
            <div class="filters">
                <label>Cupom <input id="coupon" type="text" placeholder="DANTECH10"></label>
                <button id="coupon-apply" class="btn" type="button">Aplicar</button>
                <label>Parcelas
                    <select id="installments">
                        <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option>
                        <option value="4">4x</option><option value="5">5x</option><option value="6">6x</option>
                        <option value="7">7x</option><option value="8">8x</option><option value="9">9x</option>
                        <option value="10">10x</option><option value="11">11x</option><option value="12" selected>12x</option>
                    </select>
                </label>
            </div>
            <div id="cart-totals" aria-live="polite"></div>
            <p id="cart-message" role="status"></p>
            <button id="checkout" class="btn" type="button" disabled>Finalizar compra</button>
        </section>
    </main>
    <script>
        // cart.js is CommonJS; provide a minimal shim so it can load in the browser.
        window.module = { exports: {} };
    </script>
    <script src="cart.js"></script>
    <script src="specsheet.js"></script>
    <script>
        window.DanTechCart = window.module.exports;
    </script>
    <script src="app.js"></script>
</body>
</html>
