<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>Dan Pets</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Dan Pets</h1></header>
  <main>
    <div id="list-view">
    <label class="search"><span>Buscar</span> <input id="search" type="search" placeholder="Ex.: racao, banho, gatos"></label>
    <nav id="categories" aria-label="Categorias"></nav>
    <section id="catalog" class="grid" aria-live="polite"></section>
    <p id="empty" class="muted" hidden>Nenhum item encontrado.</p>
    <section>
      <h2>Portes</h2>
      <ul id="sizes"></ul>
    </section>
    <section>
      <h2>Tabela de peso e dosagem</h2>
      <p class="muted">Referencia generica e ilustrativa, nao especifica de produto. Siga a bula e a orientacao do veterinario; o limite superior de cada faixa e inclusivo.</p>
      <table id="dosage">
        <thead><tr><th>Porte</th><th>Peso</th><th>Dose</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    </div>
    <section id="detail-view" hidden></section>
  </main>
  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
