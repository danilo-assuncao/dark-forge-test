<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dan Hub Coworking</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Dan Hub Coworking</h1>
    <form id="filter-form">
      <div class="field">
        <label for="date-input">Data:</label>
        <input type="date" id="date-input" required>
      </div>
      <div class="field">
        <label for="attendees-input">Participantes:</label>
        <input type="number" id="attendees-input" min="1" value="1" required>
      </div>
      <div class="field">
        <label for="start-input">Início:</label>
        <select id="start-input">
          <option value="8">08:00</option>
          <option value="9">09:00</option>
          <option value="10">10:00</option>
          <option value="11">11:00</option>
          <option value="12">12:00</option>
          <option value="13">13:00</option>
          <option value="14">14:00</option>
          <option value="15">15:00</option>
          <option value="16">16:00</option>
          <option value="17">17:00</option>
          <option value="18">18:00</option>
          <option value="19">19:00</option>
        </select>
      </div>
      <div class="field">
        <label for="end-input">Fim:</label>
        <select id="end-input">
          <option value="9">09:00</option>
          <option value="10">10:00</option>
          <option value="11">11:00</option>
          <option value="12">12:00</option>
          <option value="13">13:00</option>
          <option value="14">14:00</option>
          <option value="15">15:00</option>
          <option value="16">16:00</option>
          <option value="17">17:00</option>
          <option value="18">18:00</option>
          <option value="19">19:00</option>
          <option value="20" selected>20:00</option>
        </select>
      </div>
      
      <div class="field">
        <label>Serviços Extras:</label>
        <div id="amenities-container"></div>
      </div>
      
      <div class="field">
        <label for="coupon-input">Cupom:</label>
        <input type="text" id="coupon-input" placeholder="Ex: DANHUB15">
      </div>
      
      <button type="submit" id="search-btn">Buscar</button>
    </form>
    
    <div id="success-msg"></div>
    <div id="spaces-list"></div>
  </main>
  
  <script src="shim.js"></script>
  <script src="spaces.js"></script>
  <script src="save-spaces.js"></script>
  <script src="bookings.js"></script>
  <script src="save-bookings.js"></script>
  <script src="amenities.js"></script>
  <script src="save-amenities.js"></script>
  <script src="cleanup.js"></script>
  <script src="app.js"></script>
</body>
</html>
