<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Invest - Painel Interativo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Dan Invest</h1>
        <nav aria-label="Navegação Principal">
            <button class="tab-btn active" data-target="simulador">Simulador CDB/LCI</button>
            <button class="tab-btn" data-target="regra">Regra 50-30-20</button>
            <button class="tab-btn" data-target="rebalanceamento">Rebalanceamento</button>
            <button class="tab-btn" data-target="diagnostico">Diagnóstico</button>
        </nav>
    </header>

    <main>
        <!-- Simulador CDB/LCI -->
        <section id="simulador" class="tab-content active" aria-labelledby="simulador-title">
            <h2 id="simulador-title">Simulador CDB vs LCI</h2>
            <form id="simulador-form">
                <div class="form-group">
                    <label for="sim-capital">Capital Inicial (R$):</label>
                    <input type="number" id="sim-capital" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="sim-di">Taxa DI Anual (%):</label>
                    <input type="number" id="sim-di" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="sim-cdb">% do DI - CDB:</label>
                    <input type="number" id="sim-cdb" step="0.1" min="0" required>
                </div>
                <div class="form-group">
                    <label for="sim-lci">% do DI - LCI:</label>
                    <input type="number" id="sim-lci" step="0.1" min="0" required>
                </div>
                <div class="form-group">
                    <label for="sim-prazo">Prazo (Dias):</label>
                    <input type="number" id="sim-prazo" min="1" required>
                </div>
                <button type="submit">Calcular</button>
            </form>
            <div id="simulador-result" class="result" aria-live="polite"></div>
        </section>

        <!-- Regra 50-30-20 -->
        <section id="regra" class="tab-content" aria-labelledby="regra-title">
            <h2 id="regra-title">Orçamento 50-30-20</h2>
            <form id="regra-form">
                <div class="form-group">
                    <label for="regra-renda">Renda Mensal Líquida (R$):</label>
                    <input type="number" id="regra-renda" step="0.01" min="0" required>
                </div>
                <button type="submit">Calcular</button>
            </form>
            <div id="regra-result" class="result" aria-live="polite"></div>
        </section>

        <!-- Rebalanceamento -->
        <section id="rebalanceamento" class="tab-content" aria-labelledby="rebal-title">
            <h2 id="rebal-title">Rebalanceamento de Carteira</h2>
            <form id="rebal-form">
                <div class="asset-row">
                    <div class="form-group">
                        <label for="rebal-ativo1-nome">Ativo 1 (Nome):</label>
                        <input type="text" id="rebal-ativo1-nome" value="Ações" required>
                    </div>
                    <div class="form-group">
                        <label for="rebal-ativo1-atual">Valor Atual (R$):</label>
                        <input type="number" id="rebal-ativo1-atual" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="rebal-ativo1-ideal">Alvo Ideal (%):</label>
                        <input type="number" id="rebal-ativo1-ideal" step="0.1" min="0" max="100" required>
                    </div>
                </div>
                <div class="asset-row">
                    <div class="form-group">
                        <label for="rebal-ativo2-nome">Ativo 2 (Nome):</label>
                        <input type="text" id="rebal-ativo2-nome" value="Renda Fixa" required>
                    </div>
                    <div class="form-group">
                        <label for="rebal-ativo2-atual">Valor Atual (R$):</label>
                        <input type="number" id="rebal-ativo2-atual" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="rebal-ativo2-ideal">Alvo Ideal (%):</label>
                        <input type="number" id="rebal-ativo2-ideal" step="0.1" min="0" max="100" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="rebal-aporte">Aporte (R$):</label>
                    <input type="number" id="rebal-aporte" step="0.01" min="0" value="0">
                </div>
                <button type="submit">Calcular</button>
            </form>
            <div id="rebal-result" class="result" aria-live="polite"></div>
        </section>

        <!-- Diagnóstico -->
        <section id="diagnostico" class="tab-content" aria-labelledby="diag-title">
            <h2 id="diag-title">Diagnóstico de Investimentos</h2>
            <button id="btn-diagnostico">Gerar Diagnóstico INV-XXXX</button>
            <div id="diagnostico-result" class="result" aria-live="polite"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
